# Used by the `audit` CI job (`cargo deny check advisories`). Advisories only.
[advisories]
# Fail on known vulnerabilities; do not fail on unmaintained crates or yanked releases.
unmaintained = "none"
yanked = "warn"
# Only exploitable by opening a db/-wal pair written by a less trusted party; Homerarr only opens its own
# database in the data volume, writable only by the app user. Remove when sqlx 0.9 (libsqlite3-sys >= 0.39) lands.
ignore = [
    { id = "RUSTSEC-2026-0459", reason = "Only exploitable by opening a db/-wal pair written by a less trusted party; Homerarr only opens its own database in the data volume, writable only by the app user. Remove when sqlx 0.9 (libsqlite3-sys >= 0.39) lands." },
]
